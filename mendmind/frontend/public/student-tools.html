<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reason X - Student Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --ink: #172033; --muted: #64748b; --line: #e8eaf2; --violet: #5146d8; --lavender: #f5f3ff; }
    body { background: #fbfcff; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .soft-grid { background-image: linear-gradient(#eef0f8 1px, transparent 1px), linear-gradient(90deg, #eef0f8 1px, transparent 1px); background-size: 32px 32px; }
    .tool-card { border: 1px solid var(--line); background: rgba(255,255,255,.9); box-shadow: 0 16px 40px rgba(45, 42, 102, .07); }
    .nav-link.active { background: #eeecff; color: var(--violet); font-weight: 700; }
  </style>
</head>
<body class="min-h-screen">
  <header class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5 lg:px-10">
    <a href="student-dashboard.html" class="text-2xl font-black tracking-tight text-slate-950">Reason <span class="text-indigo-600">X</span></a>
    <div class="flex items-center gap-3">
      <a href="student-dashboard.html" class="hidden rounded-full px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 sm:inline-flex">Dashboard</a>
      <a href="login_fixed.html" class="rounded-full bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-200 hover:bg-indigo-700">Sign out</a>
    </div>
  </header>

  <main class="soft-grid border-y border-slate-100">
    <div class="mx-auto grid max-w-7xl gap-8 px-6 py-8 lg:grid-cols-[230px_1fr] lg:px-10 lg:py-12">
      <aside class="tool-card h-fit rounded-3xl p-4">
        <p class="px-3 pb-3 text-[11px] font-extrabold uppercase tracking-[.18em] text-slate-400">Student space</p>
        <nav id="tool-nav" class="space-y-1"></nav>
        <div class="mt-5 border-t border-slate-100 pt-4">
          <a href="student-dashboard.html" class="flex items-center gap-3 rounded-2xl px-3 py-3 text-sm font-semibold text-slate-500 hover:bg-slate-50 hover:text-slate-900"><i data-lucide="arrow-left" class="h-4 w-4"></i>Back to dashboard</a>
        </div>
      </aside>

      <section class="min-w-0">
        <div class="mb-8 flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
          <div>
            <p id="eyebrow" class="text-xs font-extrabold uppercase tracking-[.18em] text-indigo-600">Student workspace</p>
            <h1 id="title" class="mt-2 text-4xl font-black tracking-tight text-slate-950 sm:text-5xl"></h1>
            <p id="description" class="mt-3 max-w-2xl text-base leading-7 text-slate-600"></p>
          </div>
          <div class="rounded-2xl border border-indigo-100 bg-white px-4 py-3 text-right shadow-sm">
            <p class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Today</p>
            <p id="today" class="mt-1 text-sm font-bold text-slate-800"></p>
          </div>
        </div>
        <div id="content"></div>
      </section>
    </div>
  </main>

  <script>
    const views = {
      learning: { title: 'My Learning', description: 'Choose a subject or learning tool and continue from where you left off.', icon: 'book-open', tone: 'indigo', cta: 'Choose your next step', cards: [['Practice', 'Work through adaptive questions and build concept mastery.', 'Open practice', 'student-tools.html?view=practice'], ['Quizzes', 'Check your understanding with focused subject reviews.', 'Browse quizzes', 'student-tools.html?view=quizzes'], ['Progress', 'Review mastery and recent practice activity.', 'View progress', 'student-tools.html?view=progress'], ['Notes', 'Save the ideas and explanations you want to remember.', 'Open notes', 'student-tools.html?view=notes']] },
      practice: { title: 'Practice center', description: 'Build confidence with short, focused sessions tailored to the concepts you are learning.', icon: 'book-open', tone: 'emerald', cta: 'Start a 50-question quiz', cards: [['Mathematics', 'Fractions, equations, and number sense', '10 questions', 'ai-tutor.html?quiz=Math'], ['Data Structures', 'Binary search, queues, and complexity', '10 questions', 'ai-tutor.html?quiz=DSA'], ['Science', 'Forces, seasons, and core concepts', '10 questions', 'ai-tutor.html?quiz=Science'], ['Python', 'Functions, lists, and core language syntax', '10 questions', 'ai-tutor.html?quiz=Python'], ['Java', 'Entry points, primitive types, and objects', '10 questions', 'ai-tutor.html?quiz=Java'], ['All subjects', 'A balanced quiz across all five subjects', '50 questions', 'ai-tutor.html?quiz=all']] },
      quizzes: { title: 'Quizzes', description: 'Choose a subject or take a balanced quiz across the full question bank.', icon: 'circle-check', tone: 'amber', cta: 'Start a quiz', cards: [['All subjects', 'Practice across Math, DSA, Science, Python, and Java', '50 questions', 'ai-tutor.html?quiz=all'], ['Math', 'Fractions, equations, and number sense', '10 questions', 'ai-tutor.html?quiz=Math'], ['DSA', 'Algorithms and data structures', '10 questions', 'ai-tutor.html?quiz=DSA'], ['Science', 'Core science concepts', '10 questions', 'ai-tutor.html?quiz=Science'], ['Python', 'Functions, lists, and syntax', '10 questions', 'ai-tutor.html?quiz=Python'], ['Java', 'Types, methods, and objects', '10 questions', 'ai-tutor.html?quiz=Java']] },
      progress: { title: 'Your progress', description: 'Your activity and mastery, based on your own practice.', icon: 'trending-up', tone: 'rose', cta: 'Start practicing', cards: [] },
      notes: { title: 'Notes', description: 'Keep the ideas that matter close by. Review, organize, and add notes while you learn.', icon: 'notebook-pen', tone: 'sky', cta: 'Create a note', cards: [] },
      projects: { title: 'Projects', description: 'Your saved projects will appear here.', icon: 'folder-kanban', tone: 'violet', cta: 'Explore practice', cards: [] },
      calendar: { title: 'Learning calendar', description: 'Your planned study sessions will appear here.', icon: 'calendar-days', tone: 'indigo', cta: 'Explore practice', cards: [] },
      settings: { title: 'Settings', description: 'Personalize your study routine and choose the subject you want to practice by default.', icon: 'settings-2', tone: 'indigo', cta: 'Save your preferences', cards: [] }
    };
    const navItems = [['learning', 'My Learning', 'book-open'], ['practice', 'Practice', 'brain'], ['quizzes', 'Quizzes', 'circle-check'], ['progress', 'Progress', 'trending-up'], ['notes', 'Notes', 'notebook-pen'], ['projects', 'Projects', 'folder-kanban'], ['calendar', 'Calendar', 'calendar-days'], ['settings', 'Settings', 'settings-2']];
    const params = new URLSearchParams(window.location.search);
    const key = views[params.get('view')] ? params.get('view') : 'practice';
    const view = views[key];
    const colors = { emerald: ['bg-emerald-50', 'text-emerald-700', 'border-emerald-100'], amber: ['bg-amber-50', 'text-amber-700', 'border-amber-100'], rose: ['bg-rose-50', 'text-rose-700', 'border-rose-100'], sky: ['bg-sky-50', 'text-sky-700', 'border-sky-100'], violet: ['bg-violet-50', 'text-violet-700', 'border-violet-100'], indigo: ['bg-indigo-50', 'text-indigo-700', 'border-indigo-100'] };
    const [soft, accent, border] = colors[view.tone];
    document.title = `Reason X - ${view.title}`;
    document.getElementById('title').textContent = view.title;
    document.getElementById('description').textContent = view.description;
    document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    document.getElementById('tool-nav').innerHTML = navItems.map(([id, label, icon]) => `<a class="nav-link ${id === key ? 'active' : ''} flex items-center gap-3 rounded-2xl px-3 py-3 text-sm text-slate-600 transition hover:bg-slate-50" href="student-tools.html?view=${id}"><i data-lucide="${icon}" class="h-4 w-4"></i>${label}</a>`).join('');
    const content = document.getElementById('content');
    if (key === 'settings') {
      let preferences = { defaultSubject: 'Math', dailyGoal: 10, reminders: true };
      try { preferences = { ...preferences, ...JSON.parse(localStorage.getItem('reasonxStudentPreferences') || '{}') }; } catch {}
      content.innerHTML = `<form id="preferences-form" class="tool-card max-w-2xl rounded-3xl p-6"><h2 class="text-xl font-black text-slate-900">Learning routine</h2><label for="default-subject" class="mt-5 block text-sm font-bold text-slate-700">Default practice subject</label><select id="default-subject" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm"><option value="Math">Mathematics</option><option value="DSA">Data Structures &amp; Algorithms</option><option value="Science">Science</option><option value="Python">Python</option><option value="Java">Java</option></select><label for="daily-goal" class="mt-4 block text-sm font-bold text-slate-700">Daily question goal</label><select id="daily-goal" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm"><option value="5">5 questions</option><option value="10">10 questions</option><option value="15">15 questions</option><option value="20">20 questions</option></select><label class="mt-5 flex items-center gap-3 text-sm font-semibold text-slate-700"><input id="study-reminders" type="checkbox" class="h-4 w-4 accent-indigo-600">Study reminders enabled</label><button type="submit" class="mt-6 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold text-white hover:bg-indigo-700">Save preferences</button><p id="settings-status" class="mt-3 text-sm font-semibold text-emerald-700" role="status"></p></form>`;
      document.getElementById('default-subject').value = preferences.defaultSubject;
      document.getElementById('daily-goal').value = String(preferences.dailyGoal);
      document.getElementById('study-reminders').checked = Boolean(preferences.reminders);
      document.getElementById('preferences-form').addEventListener('submit', function (event) {
        event.preventDefault();
        localStorage.setItem('reasonxStudentPreferences', JSON.stringify({ defaultSubject: document.getElementById('default-subject').value, dailyGoal: Number(document.getElementById('daily-goal').value), reminders: document.getElementById('study-reminders').checked }));
        document.getElementById('settings-status').textContent = 'Preferences saved.';
      });
    } else if (key === 'progress') {
      content.innerHTML = `<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"><article class="tool-card rounded-2xl p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">Questions solved</p><p id="progress-solved" class="mt-3 text-3xl font-black text-slate-900">0</p></article><article class="tool-card rounded-2xl p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">First-try accuracy</p><p id="progress-accuracy" class="mt-3 text-3xl font-black text-slate-900">0%</p></article><article class="tool-card rounded-2xl p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">Recoveries completed</p><p id="progress-recoveries" class="mt-3 text-3xl font-black text-slate-900">0</p></article><article class="tool-card rounded-2xl p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-500">Overall mastery</p><p id="progress-mastery" class="mt-3 text-3xl font-black text-slate-900">0%</p></article></div><p id="progress-status" class="mt-5 text-sm text-slate-500" role="status" aria-live="polite">Loading your progress...</p><a href="ai-tutor.html?quiz=all" class="mt-4 inline-flex rounded-lg bg-indigo-700 px-4 py-2.5 text-sm font-bold text-white">Start a quiz</a>`;
      const progressUser = JSON.parse(localStorage.getItem('reasonXUser') || 'null');
      const progressStatus = document.getElementById('progress-status');
      if (!progressUser || !progressUser.email) {
        progressStatus.textContent = 'Sign in to view your saved progress.';
      } else {
        Promise.all([
          fetch(`http://127.0.0.1:8000/api/analytics/student/${encodeURIComponent(progressUser.email)}`).then(response => response.ok ? response.json() : Promise.reject()),
          fetch(`http://127.0.0.1:8000/api/state/${encodeURIComponent(progressUser.email)}`).then(response => response.ok ? response.json() : Promise.reject())
        ]).then(([analytics, learnerState]) => {
          document.getElementById('progress-solved').textContent = analytics.questionsSolved ?? 0;
          document.getElementById('progress-accuracy').textContent = `${Math.round((analytics.firstTryAccuracy || 0) * 100)}%`;
          document.getElementById('progress-recoveries').textContent = analytics.recoveriesCompleted ?? 0;
          const values = Object.values(learnerState.mastery || {});
          const mastery = values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
          document.getElementById('progress-mastery').textContent = `${Math.round(mastery * 100)}%`;
          progressStatus.textContent = analytics.totalAttempts ? 'Progress reflects your recorded practice.' : 'No practice data yet. Your progress will appear after your first quiz.';
        }).catch(() => {
          progressStatus.textContent = 'Could not load saved progress. Check that the backend is running.';
        });
      }
    } else if (key === 'calendar') {
      content.innerHTML = '<div class="tool-card max-w-2xl rounded-2xl p-6"><h2 class="text-lg font-black text-slate-900">No sessions scheduled</h2><p class="mt-2 text-sm leading-6 text-slate-600">Study sessions you schedule will appear here.</p></div>';
    } else if (key === 'projects') {
      content.innerHTML = '<div class="tool-card max-w-2xl rounded-2xl p-6"><h2 class="text-lg font-black text-slate-900">No saved projects</h2><p class="mt-2 text-sm leading-6 text-slate-600">Projects you create will appear here.</p></div>';
    } else if (key === 'notes') {
      content.innerHTML = `<div class="grid items-start gap-5 lg:grid-cols-[.8fr_1.2fr]"><form id="note-form" class="tool-card rounded-3xl p-6"><h2 class="text-xl font-black text-slate-900">Add a note</h2><label for="note-title" class="mt-4 block text-sm font-bold text-slate-700">Title</label><input id="note-title" required maxlength="80" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm" placeholder="A key idea to remember"><label for="note-subject" class="mt-4 block text-sm font-bold text-slate-700">Subject</label><select id="note-subject" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm"><option>Mathematics</option><option>Data Structures &amp; Algorithms</option><option>Science</option><option>Python</option><option>Java</option><option>General</option></select><label for="note-body" class="mt-4 block text-sm font-bold text-slate-700">Note</label><textarea id="note-body" required rows="5" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm" placeholder="Write an explanation, example, or reminder..."></textarea><button class="mt-4 w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white hover:bg-indigo-700">Save note</button></form><section><div class="mb-3 flex items-center justify-between gap-3"><h2 class="text-xl font-black text-slate-900">Your notes</h2><input id="note-search" aria-label="Search notes" placeholder="Search notes" class="w-48 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm"></div><div id="saved-notes" class="space-y-3"></div></section></div>`;
      const storedNotes = () => { try { return JSON.parse(localStorage.getItem('reasonxStudentNotes') || '[]'); } catch { return []; } };
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
      const renderNotes = () => {
        const filter = document.getElementById('note-search').value.toLowerCase();
        const notes = storedNotes().filter((note) => `${note.title} ${note.subject} ${note.body}`.toLowerCase().includes(filter));
        document.getElementById('saved-notes').innerHTML = notes.length ? notes.map((note) => `<article class="tool-card rounded-2xl p-5"><div class="flex items-start justify-between gap-3"><div><h3 class="font-black text-slate-900">${escapeHtml(note.title)}</h3><p class="mt-1 text-xs font-bold text-indigo-700">${escapeHtml(note.subject)}</p></div><button type="button" data-delete-note="${escapeHtml(note.id)}" class="text-xs font-bold text-rose-600 hover:text-rose-800">Delete</button></div><p class="mt-3 whitespace-pre-wrap text-sm leading-6 text-slate-600">${escapeHtml(note.body)}</p></article>`).join('') : '<div class="tool-card rounded-2xl p-8 text-center text-sm text-slate-500">No notes yet. Add one to keep an idea handy.</div>';
        document.querySelectorAll('[data-delete-note]').forEach((button) => button.addEventListener('click', () => { localStorage.setItem('reasonxStudentNotes', JSON.stringify(storedNotes().filter((note) => note.id !== button.dataset.deleteNote))); renderNotes(); }));
      };
      document.getElementById('note-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const notes = storedNotes();
        notes.unshift({ id: crypto.randomUUID(), title: document.getElementById('note-title').value.trim(), subject: document.getElementById('note-subject').value, body: document.getElementById('note-body').value.trim(), createdAt: new Date().toISOString() });
        localStorage.setItem('reasonxStudentNotes', JSON.stringify(notes));
        this.reset();
        renderNotes();
      });
      document.getElementById('note-search').addEventListener('input', renderNotes);
      renderNotes();
    } else {
      const fallbackHref = key === 'practice' ? 'ai-tutor.html?quiz=all' : key === 'quizzes' ? view.cards[0][3] : key === 'progress' ? 'student-tools.html?view=practice' : key === 'projects' ? view.cards[0][3] : key === 'calendar' ? 'student-dashboard.html' : 'student-tools.html?view=learning';
      content.innerHTML = `<div class="grid gap-5 md:grid-cols-3">${view.cards.map(([heading, text, meta, target]) => {
        const href = target || fallbackHref;
        const action = key === 'quizzes' ? 'Start quiz' : key === 'progress' ? 'Practice next' : key === 'learning' ? meta : key === 'calendar' ? 'Open activity' : key === 'projects' ? 'Open project' : 'Open workspace';
        return `<article class="tool-card rounded-3xl p-6 transition hover:-translate-y-1 hover:shadow-xl"><div class="flex items-start justify-between gap-3"><div class="grid h-12 w-12 place-items-center rounded-2xl ${soft} ${accent}"><i data-lucide="${view.icon}" class="h-6 w-6"></i></div><span class="rounded-full ${soft} px-3 py-1 text-xs font-bold ${accent}">${meta}</span></div><h2 class="mt-7 text-xl font-black text-slate-900">${heading}</h2><p class="mt-2 min-h-12 text-sm leading-6 text-slate-500">${text}</p><a href="${href}" class="mt-7 inline-flex items-center gap-2 rounded-full border ${border} px-4 py-2.5 text-sm font-bold ${accent} hover:${soft}">${action} <i data-lucide="arrow-up-right" class="h-4 w-4"></i></a></article>`;
      }).join('')}</div><div class="tool-card mt-6 flex flex-col items-start justify-between gap-4 rounded-3xl p-6 sm:flex-row sm:items-center"><div><p class="text-xs font-extrabold uppercase tracking-wider ${accent}">Keep moving</p><h2 class="mt-1 text-xl font-black text-slate-900">${view.cta}</h2><p class="mt-1 text-sm text-slate-500">A small step today keeps your learning momentum strong.</p></div><a href="${fallbackHref}" class="rounded-full bg-indigo-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-200 hover:bg-indigo-700">Continue</a></div>`;
    }
    lucide.createIcons();
  </script>
</body>
</html>
