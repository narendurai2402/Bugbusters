<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reason X - Choose Your Role</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#5d5fef',
              600: '#4e51eb',
              700: '#4343d5',
            }
          },
          boxShadow: {
            'custom-card':
              '0 20px 45px -10px rgba(93, 95, 239, 0.12), 0 8px 20px -4px rgba(0, 0, 0, 0.04)',
            'btn-glow':
              '0 8px 24px -4px rgba(93, 95, 239, 0.5)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f1f2fc;
      background-image:
        radial-gradient(
          circle at 8% 18%,
          rgba(214, 218, 255, 0.8) 0%,
          transparent 40%
        ),
        radial-gradient(
          circle at 92% 15%,
          rgba(226, 215, 255, 0.8) 0%,
          transparent 42%
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(240, 243, 255, 0.9) 0%,
          transparent 60%
        ),
        radial-gradient(
          circle at 95% 85%,
          rgba(199, 210, 254, 0.7) 0%,
          transparent 45%
        ),
        radial-gradient(
          circle at 5% 90%,
          rgba(216, 219, 255, 0.7) 0%,
          transparent 42%
        );
      background-attachment: fixed;
    }
    .ambient-sphere-1 {
      position: absolute;
      width: 380px;
      height: 380px;
      left: -80px;
      top: 140px;
      background:
        radial-gradient(
          circle,
          rgba(165, 180, 252, 0.45) 0%,
          rgba(199, 210, 254, 0.05) 70%
        );
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }
    .ambient-sphere-2 {
      position: absolute;
      width: 440px;
      height: 440px;
      right: -100px;
      bottom: -60px;
      background:
        radial-gradient(
          circle,
          rgba(196, 181, 253, 0.4) 0%,
          rgba(224, 231, 255, 0.05) 70%
        );
      border-radius: 50%;
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
    }
    /* Card hover */
    .role-card {
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }
    .role-card:hover {
      transform: translateY(-5px);
    }
    /* Selected role */
    .role-card.selected {
      border-color: #5d5fef;
      background: rgba(244, 242, 255, 0.9);
      box-shadow:
        0 10px 30px rgba(93, 95, 239, 0.14),
        0 4px 12px rgba(0, 0, 0, 0.04);
    }
    .role-icon {
      transition: transform 0.25s ease;
    }
    .role-card:hover .role-icon {
      transform: scale(1.08);
    }
    /* Selected check */
    .check-badge {
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.2s ease;
    }
    .role-card.selected .check-badge {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body class="font-sans text-slate-800 antialiased min-h-screen flex flex-col relative overflow-hidden">
  <!-- Ambient Background -->
  <div class="ambient-sphere-1"></div>
  <div class="ambient-sphere-2"></div>
  <!-- ================= HEADER ================= -->
  <header class="w-full max-w-7xl mx-auto px-6 lg:px-10 py-5
           flex items-center justify-between relative z-20">
    <!-- Logo -->
    <a href="#" class="flex items-center gap-1.5">
      <span class="text-2xl font-extrabold tracking-tight text-slate-900">
        Reason
      </span>
      <span class="text-2xl font-extrabold tracking-tight text-[#5d5fef]">
        X
      </span>
    </a>
    <!-- Header Login -->
    
  </header>
  <!-- ================= MAIN ================= -->
  <main class="flex-grow flex items-center justify-center
           px-6 py-10 relative z-10">
    <div class="w-full max-w-[650px]">
      <!-- Main Card -->
      <div class="bg-white
               rounded-[2.2rem]
               p-7 sm:p-10
               shadow-custom-card
               border border-white/90">
        <!-- Small Badge -->
        <div class="flex justify-center mb-5">
          <div class="inline-flex items-center gap-2
                   px-4 py-2
                   rounded-full
                   bg-[#f4f2ff]
                   border border-indigo-100/80
                   text-[#5d5fef]
                   text-xs font-semibold">
            <span class="">✨</span>
            <span class="">Welcome to Reason X</span>
          </div>
        </div>
        <!-- Heading -->
        <div class="text-center mb-8">
          <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
            Who are you?
          </h1>
          <p class="text-sm text-slate-500 mt-2 leading-relaxed">
            Choose your role to continue to Reason X
          </p>
        </div>
        <!-- ================= ROLE CARDS ================= -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <!-- STUDENT -->
          <button id="studentCard" type="button" onclick="selectRole('student')" class="role-card selected relative text-left p-6 rounded-[1.5rem] border-2 border-[#5d5fef] bg-[#f4f2ff]/80 cursor-pointer">
            <!-- Check -->
            <div class="check-badge
                     absolute
                     top-4
                     right-4
                     w-6
                     h-6
                     rounded-full
                     bg-[#5d5fef]
                     text-white
                     flex items-center justify-center">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
            <!-- Icon -->
            <div class="role-icon w-16 h-16 rounded-2xl bg-white border border-indigo-100 flex items-center justify-center text-3xl shadow-sm mb-5">
              🎓
            </div>
            <!-- Text -->
            <h2 class="text-lg font-bold text-slate-900">
              Student
            </h2>
            <p class="text-sm text-slate-500 mt-1 leading-relaxed">
              Learn, practice &amp; grow
            </p>
          </button>
          <!-- TEACHER -->
          <button id="teacherCard" type="button" onclick="selectRole('teacher')" class="role-card relative text-left p-6 rounded-[1.5rem] border-2 border-slate-200/90 bg-white cursor-pointer">
            <!-- Check -->
            <div class="check-badge
                     absolute
                     top-4
                     right-4
                     w-6
                     h-6
                     rounded-full
                     bg-[#5d5fef]
                     text-white
                     flex items-center justify-center">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
            <!-- Icon -->
            <div class="role-icon w-16 h-16 rounded-2xl bg-white border border-indigo-100 flex items-center justify-center text-3xl shadow-sm mb-5">
              👨‍🏫
            </div>
            <!-- Text -->
            <h2 class="text-lg font-bold text-slate-900">
              Teacher
            </h2>
            <p class="text-sm text-slate-500 mt-1 leading-relaxed">
              Teach, manage &amp; guide
            </p>
          </button>
        </div>
        <!-- ================= CONTINUE ================= -->
        <div class="mt-8">
          <button id="continueBtn" onclick="continueToLogin()" class="w-full py-3.5 px-4 rounded-xl text-white font-semibold text-sm bg-[#5d5fef] hover:bg-[#4e51eb] shadow-btn-glow transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.99]">
            <span class="">Continue as Student</span>
            <span class="text-base leading-none">
              →
            </span>
          </button>
        </div>
        <!-- Login text -->
        <div class="mt-6 text-center text-xs text-slate-500">
          Already have an account?
          <a href="login.html" class="font-bold text-[#5d5fef] hover:text-[#4343d5] hover:underline">
            Log in
          </a>
        </div>
      </div>
    </div>
  </main>
  <!-- ================= FOOTER ================= -->
  <footer class="w-full py-4
           text-center
           text-xs
           text-slate-400
           relative z-10">
    © 2025 Reason X. All rights reserved.
  </footer>
  <!-- ================= ROLE LOGIC ================= -->
  <script>
    let selectedRole = "student";
    function selectRole(role) {
      selectedRole = role;
      const studentCard =
        document.getElementById("studentCard");
      const teacherCard =
        document.getElementById("teacherCard");
      const continueBtn =
        document.getElementById("continueBtn");
      /* Remove selected state */
      studentCard.classList.remove("selected");
      teacherCard.classList.remove("selected");
      /* Add selected state */
      if (role === "student") {
        studentCard.classList.add("selected");
        continueBtn.querySelector("span").textContent =
          "Continue as Student";
      }
      if (role === "teacher") {
        teacherCard.classList.add("selected");
        continueBtn.querySelector("span").textContent =
          "Continue as Teacher";
      }
      /* Store selected role */
      localStorage.setItem(
        "reasonXRole",
        selectedRole
      );
    }
    function continueToLogin() {
      /*
       * Selected role is already stored.
       * Login page can read it using:
       *
       * localStorage.getItem("reasonXRole")
       */
      localStorage.setItem(
        "reasonXRole",
        selectedRole
      );
      /* Go to existing Login page */
      window.location.href = "login.html";
    }
  </script>




<script id="reasonx-auth">
(function () {
  const PAGES = {
    home: 'index.html',
    signup: 'signup.html',
    role: 'role-selection.html',
    verify: 'email-verification.html',
    login: 'login.html',
    student: 'student-dashboard.html',
    tutor: 'ai-tutor.html',
    teacher: 'teacher-dashboard.html'
  };

  window.ReasonXAuth = {
    getRole() { return localStorage.getItem('reasonXRole') || ''; },
    isLoggedIn() { return localStorage.getItem('reasonXLoggedIn') === 'true'; },
    setRole(role) {
      if (role === 'student' || role === 'teacher') localStorage.setItem('reasonXRole', role);
    },
    login(role) {
      this.setRole(role);
      localStorage.setItem('reasonXLoggedIn', 'true');
      localStorage.setItem('reasonXLoginAt', new Date().toISOString());
    },
    logout() {
      localStorage.removeItem('reasonXLoggedIn');
      localStorage.removeItem('reasonXLoginAt');
      window.location.href = PAGES.login;
    },
    goByRole() {
      const role = this.getRole();
      if (!this.isLoggedIn()) { window.location.href = PAGES.login; return; }
      window.location.href = role === 'teacher' ? PAGES.teacher : PAGES.student;
    }
  };

  window.RX = window.ReasonXAuth;
})();
</script>

<script>
(function () {
  const original = window.continueToLogin;
  window.continueToLogin = function () {
    const role = localStorage.getItem('reasonXRole');
    if (!role) {
      alert('Please select Student or Teacher first.');
      return;
    }
    localStorage.setItem('reasonXRole', role);
    window.location.href = 'email-verification.html';
  };
})();
</script>

</body></html>
