<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MisconceptionOS — AI that understands why you're wrong</title>
<style>
  :root{
    --bg:#060609; --bg2:#0a0a10; --card:#101018; --card2:#0d0d15;
    --border:#1e1e2c; --border2:#2c2c40;
    --txt:#f2f2f7; --dim:#a0a3b5; --faint:#63667a;
    --accent:#7c6cff; --accent-soft:rgba(124,108,255,.10); --accent-line:rgba(124,108,255,.35);
    --glow:0 0 24px rgba(124,108,255,.25);
    --green:#34d399; --red:#fb7185; --amber:#fbbf24; --blue:#60a5fa;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(800px 400px at 20% -10%,rgba(124,108,255,.09),transparent 60%),
               radial-gradient(700px 500px at 110% 110%,rgba(96,165,250,.05),transparent 60%)}
  #app{position:relative;z-index:1}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font:inherit;color:var(--txt);background:#0b0b13;border:1px solid var(--border);border-radius:12px;padding:11px 14px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
  input:focus,textarea:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:80px}
  ::placeholder{color:var(--faint)}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#22222f;border-radius:8px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:600;padding:11px 20px;border-radius:12px;transition:filter .15s,transform .05s,box-shadow .2s;box-shadow:0 4px 18px rgba(124,108,255,.3)}
  .btn:hover{filter:brightness(1.12);box-shadow:0 4px 26px rgba(124,108,255,.45)}
  .btn:active{transform:translateY(1px)}
  .btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border2);font-weight:600;padding:9px 16px;border-radius:12px}
  .btn-ghost:hover{color:var(--txt);border-color:#3d3d55}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);color:var(--dim);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:all .15s}
  .chip:hover{color:var(--txt);border-color:var(--accent-line);background:var(--accent-soft)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.5px;border-radius:999px;padding:4px 10px;text-transform:uppercase}
  .badge.ok{background:rgba(52,211,153,.12);color:var(--green)}
  .badge.bad{background:rgba(251,113,133,.12);color:var(--red)}
  .badge.warn{background:rgba(251,191,36,.12);color:var(--amber)}
  .badge.info{background:rgba(96,165,250,.12);color:var(--blue)}
  .badge.acc{background:var(--accent-soft);color:#a99dff;border:1px solid var(--accent-line)}
  .mono{font-family:var(--mono)}
  .muted{color:var(--faint)}

  /* ---------- LANDING ---------- */
  .land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:56px}
  .hero{text-align:center;max-width:720px}
  .logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:28px}
  .logo-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#7c6cff,#5a8bff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;box-shadow:var(--glow)}
  .logo b{font-size:22px;letter-spacing:-.4px}
  .hero h1{font-size:clamp(30px,5vw,48px);line-height:1.15;letter-spacing:-1.2px;font-weight:800;margin-bottom:18px}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,#a99dff,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--dim);font-size:17px;max-width:560px;margin:0 auto 30px}
  .hero .pill-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
  .login-card{width:420px;max-width:100%;background:linear-gradient(180deg,#12121c,#0b0b12);border:1px solid var(--border);border-radius:20px;padding:34px 32px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(124,108,255,.06)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px}
  .login-card .btn{width:100%;padding:12px;margin-top:6px}
  .quick{display:flex;gap:8px;margin-top:16px}
  .quick .chip{flex:1;justify-content:center}
  .demo-note{margin-top:20px;font-size:12px;color:var(--faint);border-top:1px dashed var(--border2);padding-top:14px;line-height:1.7}

  /* ---------- SHELL ---------- */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:300px;min-width:300px;border-right:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side-head{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
  .side-body{flex:1;overflow-y:auto;padding:16px 14px}
  .side-foot{padding:14px;border-top:1px solid var(--border);display:flex;gap:8px}
  .side-foot .btn-ghost{flex:1;justify-content:center;font-size:12.5px;padding:9px}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;background:rgba(10,10,16,.75);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .crumb{font-size:13px;color:var(--faint)}
  .crumb b{color:var(--txt);font-weight:600}
  .content{flex:1;padding:28px 26px 80px}
  .content-narrow{max-width:760px;margin:0 auto}
  h1{font-size:22px;letter-spacing:-.4px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:22px}
  .sec-title{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin:18px 4px 10px}

  /* ---------- TOPICS ---------- */
  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;max-width:900px}
  .topic{background:linear-gradient(180deg,#12121c,#0c0c14);border:1px solid var(--border);border-radius:var(--r);padding:24px;text-align:left;transition:all .2s;color:var(--txt)}
  .topic.active:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--glow)}
  .topic.locked{opacity:.45;cursor:not-allowed}
  .topic .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
  .topic b{display:block;font-size:16px;margin-bottom:4px}
  .topic span{font-size:12.5px;color:var(--faint)}

  /* ---------- QUESTION ITEMS ---------- */
  .q-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid transparent;color:var(--dim);margin-bottom:4px}
  .q-item:hover{background:#15151f;color:var(--txt)}
  .q-item.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--txt)}
  .q-item .num{width:24px;height:24px;border-radius:8px;background:#1a1a26;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;font-family:var(--mono)}
  .q-item.active .num{background:var(--accent);color:#fff}
  .q-item .st{margin-left:auto;font-size:10.5px;font-weight:700}
  .st.ok{color:var(--green)}.st.bad{color:var(--red)}.st.dim{color:var(--faint)}

  .concept-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .concept-row .name{width:86px;font-size:12.5px;color:var(--dim)}
  .bar{flex:1;height:7px;background:#1a1a26;border-radius:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .5s ease}
  .bar i.g{background:var(--green)}.bar i.a{background:var(--amber)}.bar i.r{background:var(--red)}
  .concept-row .val{width:32px;text-align:right;font-size:11.5px;font-family:var(--mono);color:var(--faint)}

  /* ---------- LADDER ---------- */
  .ladder{display:flex;align-items:center;margin:10px 0 2px;max-width:560px}
  .ladder .step{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ladder .dot{width:11px;height:11px;border-radius:50%;background:#24242f;border:2px solid #24242f;transition:all .25s}
  .ladder .step.done .dot{background:var(--accent);border-color:var(--accent)}
  .ladder .step.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .ladder .lbl{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);white-space:nowrap}
  .ladder .step.now .lbl{color:#a99dff}
  .ladder .line{height:2px;flex:1;background:#24242f;margin:0 -4px 16px}
  .ladder .line.done{background:var(--accent)}

  /* ---------- CARDS ---------- */
  .qcard,.ansbox,.panel{background:linear-gradient(180deg,#12121c,#0c0c14);border:1px solid var(--border);border-radius:var(--r);padding:24px 26px;margin-bottom:18px}
  .qcard{box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .qmeta{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .stackvis{display:flex;flex-direction:column-reverse;gap:6px;width:max-content;margin:16px 0 4px}
  .cell{min-width:150px;text-align:center;padding:9px 16px;border-radius:10px;background:#15151f;border:1px solid var(--border2);font-family:var(--mono);font-size:14px}
  .cell.top{background:var(--accent-soft);border-color:var(--accent-line);color:#a99dff}
  .cell.top::after{content:"← TOP";font-size:9px;letter-spacing:1.2px;color:#a99dff;font-family:Inter,sans-serif;margin-left:10px}
  .cell.empty{border-style:dashed;color:var(--faint)}
  .ansbox label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:14px 0 6px}
  .ansbox .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  /* ---------- CHAT ---------- */
  .chat{display:flex;flex-direction:column;gap:14px;margin:8px 0 20px}
  .msg{max-width:86%;padding:13px 16px;border-radius:16px;font-size:14.5px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .who{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;color:var(--faint)}
  .msg .who .av{width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .msg.tutor{align-self:flex-start;background:#131320;border:1px solid #22222f;border-left:3px solid var(--accent)}
  .msg.tutor .who .av{background:var(--accent);color:#fff}
  .msg.student{align-self:flex-end;background:#12141f;border:1px solid #202640;border-right:3px solid var(--blue)}
  .msg.student .who{justify-content:flex-end}
  .msg.student .who .av{background:#233052;color:#bcd3ff}
  .msg .quote{color:var(--faint);font-size:12.5px;font-style:italic;margin-bottom:6px;padding-left:10px;border-left:2px solid var(--border2)}
  .msg.system{align-self:center;background:none;border:none;animation:none;font-size:11.5px;color:var(--faint);letter-spacing:.4px;text-align:center}
  .msg.guard{align-self:stretch;max-width:100%;background:rgba(251,113,133,.06);border:1px solid rgba(251,113,133,.35);border-radius:14px}
  .msg.guard .who .av{background:var(--red);color:#fff}
  .diag{align-self:flex-start;width:88%;max-width:640px;background:#0a0a12;border:1px solid var(--border);border-radius:14px;overflow:hidden;animation:pop .25s ease}
  .diag .head{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:10.5px;font-weight:700;letter-spacing:1.1px;color:var(--faint);text-transform:uppercase}
  .diag pre{padding:13px 16px;font-family:var(--mono);font-size:12.2px;line-height:1.75;color:#c5c9dd;overflow-x:auto}
  .diag .k{color:#a99dff}.diag .s{color:var(--green)}.diag .n{color:#c792ea}.diag .b{color:var(--blue)}

  /* ---------- TEACHER ---------- */
  .tgrid{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start;max-width:1100px}
  .stu-item{width:100%;text-align:left;padding:12px 14px;border-radius:13px;border:1px solid transparent;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:12px}
  .stu-item:hover{background:#15151f;color:var(--txt)}
  .stu-item.active{background:#15151f;border-color:var(--border2);color:var(--txt)}
  .stu-item .av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--accent-soft);border:1px solid var(--accent-line);color:#a99dff}
  .stu-item small{display:block;font-size:11px;color:var(--faint)}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .stat{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  .stat b{font-size:26px;letter-spacing:-.5px;display:block}
  .stat span{font-size:11.5px;color:var(--faint)}
  .evquote{background:#0a0a12;border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;padding:12px 15px;font-size:13.5px;font-style:italic;color:#d9dbe6;margin:10px 0}
  .flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px}
  .flow .tag{background:#15151f;border:1px solid var(--border2);border-radius:7px;padding:4px 10px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .flow .tag.hot{background:var(--accent-soft);border-color:var(--accent-line);color:#a99dff}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px}
  .kv dt{color:var(--faint)}
  .rec-list{font-size:12.5px;color:var(--dim)}
  .rec-list li{margin:5px 0 5px 16px}
  .center{text-align:center}
  @media(max-width:860px){.sidebar{display:none}.tgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   MisconceptionOS — interactive prototype
   Loop: attempt → diagnose (structured JSON) → probe → hint →
   explanation → recovery transfer test → learner state update
   ============================================================ */

const MISCONCEPTIONS = {
  QUEUE_STACK_CONFUSION:{label:"Queue/Stack Confusion",note:"Student applies FIFO reasoning to a LIFO structure."},
  OPERATION_CONFUSION:{label:"Operation Confusion",note:"Student mixes up what PUSH / POP / PEEK do."},
  PROCEDURAL_ERROR:{label:"Procedural Error",note:"Right rule, wrong element or step tracked."},
  CONCEPT_GAP:{label:"Concept Gap",note:"Missing prerequisite understanding of stack behaviour."},
  WRONG_RULE:{label:"Wrong Rule",note:"Student articulates an incorrect removal rule."},
  INSUFFICIENT_EVIDENCE:{label:"Insufficient Evidence",note:"Response too vague to diagnose."}
};

const QUESTIONS = [
  {
    id:"q1", concept:"LIFO", difficulty:"easy",
    prompt:"A stack contains the values below, with 30 on top. What happens after one POP operation?",
    stack:[10,20,30],
    check: t => /\b30\b/.test(t) && !/\b10\b/.test(t),
    detect:(a,r)=>{
      if (/\b10\b/.test(a) || /(inserted|added|pushed|came|went) first|oldest|bottom|fifo|\bqueue\b|first in first out/i.test(r))
        return {type:"QUEUE_STACK_CONFUSION",evidence:"Student applies insertion order (FIFO) as the removal rule.",conf:0.94,rec:"LIFO"};
      if (/\b20\b/.test(a)) return {type:"PROCEDURAL_ERROR",evidence:"Student tracks the middle element instead of the top.",conf:0.81,rec:"LIFO"};
      if (!/\b30\b/.test(a)) return {type:"CONCEPT_GAP",evidence:"Answer does not reference the top element (30).",conf:0.72,rec:"LIFO"};
      return null;
    },
    probe:"Good try — but let's examine it together. In a stack, do we normally remove the element that went in FIRST, or the one added MOST RECENTLY? 🤔",
    hint:"Picture a stack of plates 🍽️ — you can only take the plate sitting on the very top, the last one placed there.",
    explain:"A stack follows LIFO — Last In, First Out. PUSH adds to the top and POP removes from the top. Since 30 was pushed last and sits on top, POP removes 30, leaving [10, 20]. You're closer than you think — this is a super common mix-up!",
    recovery:{prompt:"Recovery check — a fresh stack, 12 on top. What will POP remove?",stack:[5,8,12],
      check: t => /\b12\b/.test(t) && !/\b5\b/.test(t)},
    chips:["10 — it was inserted first","30 — it's on top","Nothing is removed"]
  },
  {
    id:"q2", concept:"PUSH", difficulty:"easy",
    prompt:"A stack contains [5, 7] with 7 on top. PUSH(9) executes. What is on top now, and does anything get removed?",
    stack:[5,7],
    check: t => /\b9\b/.test(t) && !/(remov|delet|replac)/i.test(t),
    detect:(a,r)=>{
      if (/\b[57]\b/.test(a) || /remov|delet|replac/i.test(a))
        return {type:"OPERATION_CONFUSION",evidence:"Student believes PUSH removes or replaces an element.",conf:0.88,rec:"PUSH"};
      if (/fifo|first inserted|bottom|front/i.test(r))
        return {type:"QUEUE_STACK_CONFUSION",evidence:"Reasoning references FIFO/insertion order for a PUSH.",conf:0.79,rec:"PUSH"};
      if (!/\b9\b/.test(a)) return {type:"CONCEPT_GAP",evidence:"Answer does not identify 9 as the new top.",conf:0.7,rec:"PUSH"};
      return null;
    },
    probe:"Interesting! PUSH 'pushes' something onto the stack. Does pushing take anything away, or only put something on?",
    hint:"PUSH never removes anything — it only places a new element on top of the current stack. 📚",
    explain:"PUSH inserts a new element at the top. The stack becomes [5, 7, 9] with 9 on top. Nothing is removed — only POP removes elements. Nice effort working through it!",
    recovery:{prompt:"Recovery check — stack [4, 1], 1 on top. After PUSH(2), which value is on top?",stack:[4,1],
      check: t => /\b2\b/.test(t) && !/\b(4|1)\b/.test(t)},
    chips:["9 — nothing removed","7 stays on top","5 — the oldest leaves"]
  },
  {
    id:"q3", concept:"PEEK", difficulty:"medium",
    prompt:"A stack contains [3, 6, 9] with 9 on top. PEEK executes twice. What is returned, and how does the stack change?",
    stack:[3,6,9],
    check: t => /\b9\b/.test(t) && !/\b6\b/.test(t) && /(same|unchang|no change|nothing|both|stays|still|twice|9)/i.test(t),
    detect:(a,r)=>{
      if (/\b6\b/.test(a)) return {type:"OPERATION_CONFUSION",evidence:"Student expects PEEK to remove the top.",conf:0.9,rec:"PEEK"};
      if (!/\b9\b/.test(a)) return {type:"CONCEPT_GAP",evidence:"Answer does not identify 9 as PEEK's return value.",conf:0.72,rec:"PEEK"};
      return null;
    },
    probe:"PEEK means to 'take a peek' 👀 — just look at the top value. After looking at the top plate, is the stack any different?",
    hint:"PEEK returns the top element but does NOT pop it — the stack is exactly the same before and after each PEEK.",
    explain:"PEEK is read-only: it returns the top element (9) without removing it. Run it twice, get 9 both times, stack stays [3, 6, 9]. You've got this!",
    recovery:{prompt:"Recovery check — stack [3, 7], 7 on top. PEEK runs once. What is returned, and does the stack change?",stack:[3,7],
      check: t => /\b7\b/.test(t) && !/\b3\b/.test(t) && /(same|unchang|no|nothing|stays|still)/i.test(t)},
    chips:["9 and 9 — stack unchanged","9 then 6","9 — and 9 is removed"]
  },
  {
    id:"q4", concept:"UNDERFLOW", difficulty:"medium",
    prompt:"A stack is completely EMPTY. What happens when POP is executed on it?",
    stack:null,
    check: t => /(underflow|error|nothing|empty|cannot|can'?t|crash|fail|no element)/i.test(t) && !/\b[90]\b/.test(t),
    detect:(a,r)=>{
      if (/\b[90]\b/.test(a)) return {type:"OPERATION_CONFUSION",evidence:"Student expects POP on an empty stack to return an element.",conf:0.86,rec:"UNDERFLOW"};
      return {type:"CONCEPT_GAP",evidence:"Student has not connected empty-stack POP with underflow.",conf:0.78,rec:"UNDERFLOW"};
    },
    probe:"Hmm, tricky one. If the stack has zero elements… what exactly is there for POP to remove?",
    hint:"There is nothing to remove. Data-structures terminology has a specific name for this error condition. 🔍",
    explain:"POP on an empty stack causes an UNDERFLOW — an error condition, because there's no top element to remove. Correct implementations check isEmpty() first. Great question to wrestle with!",
    recovery:{prompt:"Recovery check — an empty stack. What happens when POP is called?",stack:null,
      check: t => /(underflow|error|nothing|empty|cannot|can'?t|fail)/i.test(t) && !/\b7\b/.test(t)},
    chips:["Underflow error","9 is removed","0 is removed"]
  },
  {
    id:"q5", concept:"PEEK", difficulty:"medium",
    prompt:"True or false, and why: 'PEEK changes the stack because it removes the top element temporarily.'",
    stack:[3,6,9],
    check: t => !/^\s*(yes|true)\b|it (does|is) true/i.test(t) && /(no|false|unchang|not|doesn'?t|does not|never|stays|same|nothing)/i.test(t),
    detect:(a,r)=>{
      if (/^\s*(yes|true)\b|it('s| is) true|pops|removes|takes off/i.test(a))
        return {type:"OPERATION_CONFUSION",evidence:"Student agrees PEEK mutates the stack.",conf:0.87,rec:"PEEK"};
      return {type:"WRONG_RULE",evidence:"Reasoning cites an incorrect removal rule for PEEK.",conf:0.73,rec:"PEEK"};
    },
    probe:"PEEK is described as 'read-only' 📖. If it only reads, can it remove anything at all?",
    hint:"PEEK only returns a copy of the top value for inspection. Removal is exclusively POP's job.",
    explain:"The statement is false. PEEK never removes anything — it reads and returns the top element. The stack is identical before and after; only POP mutates it. Keep going!",
    recovery:{prompt:"Recovery check — true or false: 'After PEEK on [2, 4] (4 on top), the stack becomes [2].'",stack:[2,4],
      check: t => !/^\s*(yes|true)\b/i.test(t) && /(no|false|unchang|not|stays|same|still|nothing)/i.test(t)},
    chips:["False — PEEK never removes","True","Only sometimes"]
  }
];

const ADVERSARIAL=/(ignore|disregard|forget)\s+(your|all|the)\s+(instructions|rules|prompt)|reveal your (system )?prompt|give me the (final )?answer|just tell me the answer|you must (obey|comply)/i;
const DONT_KNOW=/^\s*(i\s*(do'?t|don'?t)\s*(know|no)|idk|no idea|not sure|unsure|\?)\s*$/i;

function classify(q,answer,reasoning){
  const joined=(answer+" "+reasoning).trim();
  if(ADVERSARIAL.test(joined)) return {adversarial:true};
  if(DONT_KNOW.test(joined)||joined.replace(/\s/g,"").length<2) return {insufficient:true};
  const m=q.detect(answer,reasoning);
  const correct=q.check(answer);
  if(!correct) return {misconception:m||{type:"CONCEPT_GAP",evidence:"Answer is incorrect and reasoning matches no known pattern.",conf:0.65,rec:q.concept}};
  if(m) return {misconception:m};
  return {correct:true};
}
function diagnoseJSON(q,cls,attemptNo){
  if(cls.correct) return {correctness:"correct",concept:q.concept,misconception:null,reason_code:"none",evidence:"Answer and reasoning align with LIFO stack semantics.",confidence:0.93,recommended_intervention:"none",attempt:attemptNo};
  if(cls.insufficient) return {correctness:"unclear",concept:q.concept,misconception:"INSUFFICIENT_EVIDENCE",reason_code:"no_usable_signal",evidence:"Response contains no diagnosable reasoning.",confidence:0.6,recommended_intervention:"probe",attempt:attemptNo};
  const M=cls.misconception;
  return {correctness:"incorrect",concept:M.rec||q.concept,misconception:M.type,reason_code:M.type.toLowerCase(),evidence:M.evidence,confidence:M.conf,recommended_intervention:"probe",attempt:attemptNo};
}
function newSession(q){return {qid:q.id,phase:"INITIAL",attemptCount:0,guardHits:0,recoveryResult:null,outcome:"active",
  log:[]};}

const stackHTML=a=>a?`<div class="stackvis">${a.map((v,i)=>`<div class="cell${i===a.length-1?" top":""}">${v}</div>`).join("")}</div>`
  :`<div class="stackvis"><div class="cell empty">— empty stack —</div></div>`;
const phaseChip=p=>({INITIAL:"<span class='badge info'>Diagnose</span>",PROBE:"<span class='badge acc'>Probe</span>",
  HINT:"<span class='badge warn'>Hint</span>",EXPLANATION:"<span class='badge info'>Explanation</span>",
  RECOVERY:"<span class='badge acc'>Recovery test</span>",DONE:"<span class='badge ok'>Session complete</span>"}[p]||"");

function ladderHTML(cur){

    h+=`<div class="step ${i<idx?"done":i===idx?"now":""}"><div class="dot"></div><div class="lbl">${s==="INITIAL"?"Diagnose":s[0]+s.slice(1).toLowerCase()}</div></div>`;
    if(i<LADDER.length-1)h+=`<div class="line ${i<idx?"done":""}"></div>`;
  });
  return h+"</div>";
}

/* ----- the loop ----- */
function submitAttempt(){
  const u=me(),q=QUESTIONS.find(x=>x.id===u.activeQid);
  const ans=document.getElementById("in-ans").value.trim(),why=document.getElementById("in-why").value.trim();
  if(!ans&&!why)return;
  u.session=newSession(q);const s=u.session;
  s.log=[{role:"student",text:ans+(why?` — ${why}`:"")}];
  processDiagnosis(u,s,q,ans,why);save();render();
}
function processDiagnosis(u,s,q,ans,why){
  s.attemptCount++;
  const cls=classify(q,ans,why),d=diagnoseJSON(q,cls,s.attemptCount);
  if(cls.adversarial){guardBlock(u,s,q);return}
  if(cls.insufficient){
    s.phase="PROBE";s.misconception="INSUFFICIENT_EVIDENCE";s.evidence=d.evidence;s.conf=d.confidence;
    bump(u,q.concept,-2);
    s.log.push({role:"diag",data:d});
    s.log.push({role:"system",text:"INSUFFICIENT_EVIDENCE → intervention ladder engaged"});
    s.log.push({role:"tutor",text:"No worries at all — that's a brave thing to admit, and it's how learning starts. Let's build it up together. "+q.probe});
    return;
  }
  if(cls.correct){
    s.phase="RECOVERY";
    s.log.push({role:"diag",data:d});
    s.log.push({role:"tutor",text:"Correct — and your reasoning holds up beautifully. ✨ Now let's prove it transfers to a brand-new problem:"});
    return;
  }
  const M=cls.misconception;
  s.misconception=M.type;s.evidence=M.evidence;s.conf=M.conf;
  bump(u,M.rec||q.concept,-4);
  s.log.push({role:"diag",data:d});
  s.log.push({role:"system",text:`misconception detected: ${M.type} (${(M.conf*100)|0}% confidence) → PROBE`});
  s.log.push({role:"tutor",quote:ans||why,text:q.probe});
  s.phase="PROBE";
}
window.submitAttempt=submitAttempt;
function guardBlock(u,s,q){
  s.guardHits++;
  s.log.push({role:"guard",text:"I can't do that — this tutor follows its teaching policy, and answers are never handed over on demand. 🙂 But I'll happily guide you to it. Back to the task:"});
  s.log.push({role:"system",text:`adversarial input blocked (strike ${s.guardHits}/3) — not counted as evidence`});
  if(s.guardHits>=3){s.phase="DONE";s.outcome="abandoned";s.recoveryResult="fail";closeSession(u,s,q);
    s.log.push({role:"system",text:"session ended — repeated instruction-override attempts"});}
}
function submitReply(){
  const u=me(),q=QUESTIONS.find(x=>x.id===u.session.qid),s=u.session;
  const t=document.getElementById("in-reply").value.trim();if(!t)return;
  s.log.push({role:"student",text:t});s.attemptCount++;
  const cls=classify(q,t,"");
  if(cls.adversarial){guardBlock(u,s,q);save();render();return}
  if(cls.insufficient){
    s.log.push({role:"tutor",text:"That's completely fine — take your best guess, or let's try another angle. "+(s.phase==="PROBE"?q.hint:q.explain)});
    advance(u,s,q);save();render();return;
  }
  if(cls.correct||q.check(t)){
    s.log.push({role:"tutor",text:"Exactly! 🎯 That's the right idea — you reasoned your way there yourself."});
    s.phase="RECOVERY";
    s.log.push({role:"system",text:"misconception resolved in conversation → recovery test"});
  }else advance(u,s,q);
  save();render();
}
window.submitReply=submitReply;
function advance(u,s,q){
  if(s.phase==="PROBE"){s.phase="HINT";s.log.push({role:"system",text:"probe didn't land → HINT"});
    s.log.push({role:"tutor",text:"Let me re-frame it a different way. "+q.hint});}
  else if(s.phase==="HINT"){s.phase="EXPLANATION";s.log.push({role:"system",text:"hint didn't land → EXPLANATION"});
    s.log.push({role:"tutor",text:"Let's walk through it fully together — no rush. "+q.explain});
    s.phase="RECOVERY";s.log.push({role:"system",text:"explanation delivered → recovery test"});}
  else{s.phase="RECOVERY";s.log.push({role:"system",text:"→ recovery test"});}
}
function submitRecovery(){
  const u=me(),q=QUESTIONS.find(x=>x.id===u.session.qid),s=u.session;
  const t=document.getElementById("in-rec").value.trim();if(!t)return;
  s.log.push({role:"student",text:t});
  s.recoveryResult=q.recovery.check(t)?"pass":"fail";
  s.phase="DONE";s.outcome=s.recoveryResult==="pass"?"recovered":"unresolved";
  closeSession(u,s,q);
  if(s.recoveryResult==="pass"){bump(u,q.concept,+7);
    s.log.push({role:"tutor",text:"✓ Nailed it — and on a completely fresh question. That's genuine transfer: the misconception is resolved. Proud of this progress! 🎉"});}
  else{bump(u,q.concept,-5);
    s.log.push({role:"tutor",text:"Not quite — but that's useful information, not failure. This concept stays on your radar and we'll target it again next session. 💪"});}
  save();render();
}
window.submitRecovery=submitRecovery;
function bump(u,c,d){if(u.concepts)u.concepts[c]=CLAMP((u.concepts[c]??50)+d)}
function closeSession(u,s,q){
  if(s.outcome==="recovered")bump(u,q.concept,+2);
  if(s.outcome==="abandoned")bump(u,q.concept,-3);
  if(s.outcome==="active")return;
  u.progress[q.id]=s.outcome==="recovered"?"mastered":"unresolved";
  u.records.unshift({concept:q.concept,type:s.misconception||"NONE",evidence:s.evidence||"—",conf:s.conf||0.9,
    interventions:s.phase==="DONE"&&s.recoveryResult?(s.misconception?["PROBE","HINT","EXPLANATION"]:[]):["PROBE"],
    attempts:s.attemptCount,recovery:s.recoveryResult,at:Date.now()});
  u.records=u.records.slice(0,12);
}

/* ---------- teacher ---------- */
let tSel=null;
function renderTeacher(){
  const ids=Object.keys(DB.users).filter(k=>DB.users[k].role==="student");
  const list=ids.map(k=>{const s=DB.users[k];
    const flag=Object.values(s.concepts||{}).some(v=>v<50);
    return `<button class="stu-item ${tSel===k?"active":""}" onclick="selStu('${k}')">
      <span class="av">${esc(s.name[0])}</span><span>${esc(s.name)}<small>${flag?"⚠ needs attention":"on track"}</small></span></button>`}).join("");
  const target=DB.users[tSel]||DB.users[ids[0]];
  app.innerHTML=`
  <div class="shell">
    <aside class="sidebar">
      <div class="side-head"><div class="logo" style="margin-bottom:10px"><div class="logo-mark" style="width:34px;height:34px;font-size:16px">M</div>
      <b style="font-size:16px">Teacher Dashboard</b></div>
      <div style="font-size:12.5px;color:var(--dim)">Evidence, not vibes</div></div>
      <div class="side-body"><div class="sec-title">Students (${ids.length})</div>${list}</div>
      <div class="side-foot">
        <button class="btn-ghost" onclick="switchView('student')">Student view</button>
        <button class="btn-ghost" onclick="resetDemo()">Reset</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar"><span class="crumb">Dashboard / <b>${target?esc(target.name):"—"}</b></span></div>
      <div class="content"><div class="content-narrow">${target?detail(target):"<p class='muted'>No students yet.</p>"}</div></div>
    </main>
  </div>`;
}
window.selStu=k=>{tSel=k;render()};
function detail(s){
  const concepts=Object.entries(s.concepts||{});
  const flagged=concepts.filter(([,v])=>v<50).length;
  const stats=`<div class="stat-row">
    <div class="stat"><b>${concepts.length}</b><span>Concepts tracked</span></div>
    <div class="stat"><b style="color:${flagged?"var(--amber)":"var(--green)"}">${flagged}</b><span>Needing attention</span></div>
    <div class="stat"><b>${s.records.length}</b><span>Diagnosed sessions</span></div>
  </div>`;
  const bars=concepts.map(([k,v])=>`
    <div class="concept-row" style="margin-bottom:16px"><span class="name" style="width:100px">${k}</span>
    <div class="bar" style="height:9px"><i class="${mClass(v)}" style="width:${v}%"></i></div>
    <span class="val" style="width:110px;text-align:right;color:var(--dim)">${v}% · ${mLabel(v)}</span></div>`).join("")
    ||"<p class='muted'>No learner state yet.</p>";
  const r=s.records[0];
  const miscon=r?`<div class="panel"><h1 style="font-size:15px;margin-bottom:14px">Detected Misconception</h1>
    <dl class="kv" style="margin-bottom:12px">
      <dt>Concept</dt><dd>${esc(r.concept)}</dd>
      <dt>Diagnosis</dt><dd><span class="badge bad">${esc(MISCONCEPTIONS[r.type]?.label||r.type)}</span> <span class="mono muted" style="font-size:11px">${esc(r.type)}</span></dd>
      <dt>Confidence</dt><dd><b style="color:#a99dff;font-size:17px">${Math.round((r.conf||0)*100)}%</b></dd>
      <dt>Attempts</dt><dd>${r.attempts}</dd>
      <dt>Interventions</dt><dd><span class="flow">${(r.interventions.length?r.interventions:["NONE"]).map(x=>`<span class="tag ${x!=="NONE"?"hot":""}">${x}</span>`).join('<span class="muted">→</span>')}</span></dd>
      <dt>Recovery</dt><dd>${r.recovery==="pass"?'<span class="badge ok">✓ Demonstrated</span>':r.recovery==="fail"?'<span class="badge bad">✗ Not yet</span>':'<span class="badge info">—</span>'}</dd>
    </dl>
    <div class="sec-title">Evidence — student's own words</div>
    <div class="evquote">"${esc(r.evidence)}"</div>
    <div class="muted" style="font-size:12px">${esc(MISCONCEPTIONS[r.type]?.note||"")}</div>
  </div>`:`<div class="panel"><h1 style="font-size:15px;margin-bottom:10px">Detected Misconception</h1><p class="muted">No diagnosed sessions yet — complete a question as this student to generate evidence.</p></div>`;
  const hist=s.records.length?`<div class="panel"><h1 style="font-size:15px;margin-bottom:12px">Concept History</h1>
    <ul class="rec-list">${s.records.map(x=>`<li><span class="mono">${new Date(x.at).toLocaleString()}</span> — <b>${esc(x.concept)}</b> · ${esc(MISCONCEPTIONS[x.type]?.label||x.type)} · ${(x.interventions||[]).join(" → ")||"—"} · recovery ${x.recovery==="pass"?"✓":x.recovery==="fail"?"✗":"—"}</li>`).join("")}</ul></div>`:"";
  return stats+`<div class="panel"><h1 style="font-size:15px;margin-bottom:16px">Student Learning Profile — ${esc(s.name)}</h1>${bars}</div>${miscon}${hist}`;
}
render();
</script>
